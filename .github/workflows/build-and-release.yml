name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-x86
            arch: x86
          - rid: win-arm64
            arch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Resolve Release Version
        id: resolve_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } elseif ('${{ github.event.inputs.version }}' -ne '') {
            $ver = '${{ github.event.inputs.version }}'
          } else {
            $ver = '1.0.0'
          }
          Write-Host "Resolved Version: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Self-Contained Application (${{ matrix.rid }})
        shell: pwsh
        run: |
          dotnet publish DeskSeek.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/${{ matrix.rid }}

      - name: Package Portable ZIP (${{ matrix.rid }})
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zipPath = "dist/DeskSeek-v$($env:VERSION)-${{ matrix.rid }}-Portable.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $zipPath -Force
          Write-Host "Portable ZIP created: $zipPath"

      - name: Compile Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$($env:VERSION)" `
            "/DAppArch=${{ matrix.arch }}" `
            "/DSourceDir=..\publish\${{ matrix.rid }}" `
            installer/DeskSeek.iss
          Write-Host "Inno Setup compilation finished for ${{ matrix.arch }}."

      - name: Upload Build Artifacts (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: deskseek-${{ matrix.rid }}
          path: dist/*

  release:
    name: Publish Release & Assets
    needs: build
    runs-on: windows-latest

    steps:
      - name: Resolve Release Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } elseif ('${{ github.event.inputs.version }}' -ne '') {
            $ver = '${{ github.event.inputs.version }}'
          } else {
            $ver = '1.0.0'
          }
          Write-Host "Resolved Version: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          cd dist
          Get-FileHash -Algorithm SHA256 * | Where-Object { $_.Path -notlike '*checksums.txt' } | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Out-File -Encoding ascii checksums.txt
          Write-Host "Generated SHA256 checksums:"
          Get-Content checksums.txt

      - name: Upload All Release Artifacts as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskSeek-v${{ env.VERSION }}-AllPackages
          path: dist/*

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "DeskSeek v${{ env.VERSION }}"
          tag_name: ${{ github.ref_name || format('v{0}', env.VERSION) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
