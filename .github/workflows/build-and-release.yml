name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Package
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Resolve Release Version
        id: resolve_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } elseif ('${{ github.event.inputs.version }}' -ne '') {
            $ver = '${{ github.event.inputs.version }}'
          } else {
            $ver = '1.0.0'
          }
          Write-Host "Resolved Version: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Self-Contained Application
        shell: pwsh
        run: |
          dotnet publish DeskSeek.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/self-contained

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "publish/self-contained/*" -DestinationPath "dist/DeskSeek-v$($env:VERSION)-Portable.zip" -Force
          Write-Host "Portable ZIP created successfully."

      - name: Compile Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="$($env:VERSION)" installer/DeskSeek.iss
          Write-Host "Inno Setup compilation finished."

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          cd dist
          Get-FileHash -Algorithm SHA256 * | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Out-File -Encoding ascii checksums.txt
          Get-Content checksums.txt

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "DeskSeek v${{ env.VERSION }}"
          tag_name: ${{ github.ref_name || format('v{0}', env.VERSION) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/DeskSeek-v${{ env.VERSION }}-Setup.exe
            dist/DeskSeek-v${{ env.VERSION }}-Portable.zip
            dist/checksums.txt
