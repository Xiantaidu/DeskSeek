name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
      notes:
        description: 'Release Notes / Changelog'
        required: false
        default: '支持 Windows 系统明暗主题与自定义强调色自适应，修复白屏闪烁问题'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-x86
            arch: x86
          - rid: win-arm64
            arch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Resolve Release Version
        id: resolve_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } elseif ('${{ github.event.inputs.version }}' -ne '') {
            $ver = '${{ github.event.inputs.version }}'
          } else {
            $ver = '1.2.0'
          }
          Write-Host "Resolved Version: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Application (${{ matrix.rid }})
        shell: pwsh
        run: |
          dotnet publish DeskSeek.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:Version=$($env:VERSION) `
            -o publish/${{ matrix.rid }}

          # Ensure Assets directory is copied for Portable ZIP
          New-Item -ItemType Directory -Path "publish/${{ matrix.rid }}/Assets" -Force | Out-Null
          Copy-Item -Path "Assets/*" -Destination "publish/${{ matrix.rid }}/Assets" -Recurse -Force

      - name: Package Portable ZIP (${{ matrix.rid }})
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zipPath = "dist/DeskSeek-v$($env:VERSION)-${{ matrix.rid }}-Portable.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $zipPath -Force
          Write-Host "Portable ZIP created: $zipPath"

      - name: Compile Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$($env:VERSION)" `
            "/DAppArch=${{ matrix.arch }}" `
            "/DSourceDir=..\publish\${{ matrix.rid }}" `
            installer/DeskSeek.iss
          Write-Host "Inno Setup compilation finished for ${{ matrix.arch }}."

      - name: Upload Build Artifacts (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: deskseek-${{ matrix.rid }}
          path: dist/*

  release:
    name: Publish Release & Assets
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Version and Notes
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } elseif ('${{ github.event.inputs.version }}' -ne '') {
            $ver = '${{ github.event.inputs.version }}'
          } else {
            $ver = '1.2.0'
          }
          Write-Host "Resolved Version: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

          $notes = ""
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tagName = $env:GITHUB_REF -replace '^refs/tags/', ''
            $tagContent = (git tag -l --format='%(contents)' $tagName).Trim()
            if ($tagContent) {
              $notes = $tagContent
            }
          }
          if (-not $notes -and '${{ github.event.inputs.notes }}' -ne '') {
            $notes = '${{ github.event.inputs.notes }}'
          }
          if (-not $notes) {
            $notes = "DeskSeek v$ver"
          }
          Write-Host "Resolved Notes: $notes"
          $notes | Out-File -FilePath "dist_notes.md" -Encoding utf8

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          cd dist
          $files = Get-ChildItem -File | Where-Object { $_.Name -ne "checksums.txt" }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Set-Content -Path "checksums.txt" -Encoding ascii
          Write-Host "Generated SHA256 checksums:"
          Get-Content checksums.txt

      - name: Upload All Release Artifacts as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskSeek-v${{ env.VERSION }}-AllPackages
          path: dist/*

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "DeskSeek v${{ env.VERSION }}"
          tag_name: ${{ github.ref_name || format('v{0}', env.VERSION) }}
          body_path: dist_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/checksums.txt
